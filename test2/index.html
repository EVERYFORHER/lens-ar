<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LENS 알약 카드 테스트</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; overflow: hidden; }
  #ar { position: fixed; inset: 0; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: 10px 12px; background: rgba(0,0,0,.6); font-size: 14px; line-height: 1.6; z-index: 10; }
  #big { font-size: 18px; font-weight: 700; }
  .on { color: #7CFC9A; } .off { color: #aaa; } .go { color: #ffd166; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.65); display: flex; gap: 8px; z-index: 10; }
  button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; background: #2f6fde; color: #fff; }
  #start { position: fixed; inset: 0; z-index: 20; background: #111; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 14px; }
  #start p { margin: 0; color: #cfd6e0; line-height: 1.6; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #fff; color: #111; padding: 8px 14px; border-radius: 8px; display: none; z-index: 30; }
</style>
<script type="importmap">
{ "imports": { "three": "../lib/three/three.module.min.js", "three/addons/": "../lib/three/addons/" } }
</script>
</head>
<body>
<div id="start">
  <h2 style="margin:0">알약 카드 테스트</h2>
  <p>① 몸 카드(E)를 책상에 놓고 폰으로 비춰요.<br>② 다른 손으로 알약 카드(D)를 들고 입 가까이 가져가요.<br>③ 알약 카드를 숟가락처럼 기울이면 알약이 떨어져야 해요.</p>
  <p>다섯 번쯤 넣어 본 뒤 [결과 복사]를 눌러 채팅에 붙여 주세요.</p>
  <button id="go">카메라 켜고 시작</button>
</div>
<div id="ar"></div>
<div id="hud">
  <div id="big">준비 중</div>
  <div>몸 카드 E: <b id="sc" class="off">-</b> · 알약 카드 D: <b id="sd" class="off">-</b></div>
  <div id="geo">거리 - · 기울기 -</div>
  <div id="stat">초당 화면 0 · 넣은 알약 0</div>
</div>
<div id="bar"><button id="copy">결과 복사</button></div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
const $ = id => document.getElementById(id);
const NEAR = 1.0, TILT = 35, HOLD = 0.6;   // 비커 카드 가로 = 1 기준 거리, 기울기(도), 유지 시간(초)
const rec = { t0: 0, firstC: null, firstD: null, both: 0, frames: 0, drops: 0, minDist: null, maxTilt: 0 };
let fps = 0, fc = 0, lt = performance.now(), cOn = false, dOn = false, cSeen = false, holdT = 0, cool = 0;

function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500); }

async function start() {
  const { MindARThree } = await import('../lib/mindar/mindar-image-three.prod.js');
  const mindar = new MindARThree({ container: $('ar'), imageTargetSrc: '../assets/cards/cardED.mind', maxTrack: 2, uiLoading: 'no', uiScanning: 'no', uiError: 'no' });
  const { renderer, scene, camera } = mindar;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.5));
  const C = mindar.addAnchor(0), D = mindar.addAnchor(1);
  // 비커 카드 위: 간단한 투명 비커
  const beaker = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5, 32, 1, true),
    new THREE.MeshStandardMaterial({ color: 0xaad8ff, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
  beaker.rotation.x = Math.PI / 2; beaker.position.z = 0.25; C.group.add(beaker);
  // 알약 카드 위: 알약
  const pillGeo = new THREE.CapsuleGeometry(0.06, 0.12, 6, 12);
  const pillMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const pill = new THREE.Mesh(pillGeo, pillMat); pill.position.z = 0.08; pill.rotation.z = Math.PI / 2; D.group.add(pill);
  const falling = [];
  C.onTargetFound = () => { cOn = true; cSeen = true; if (rec.firstC == null) rec.firstC = (performance.now() - rec.t0) / 1000; };
  C.onTargetLost = () => { cOn = false; };
  D.onTargetFound = () => { dOn = true; if (rec.firstD == null) rec.firstD = (performance.now() - rec.t0) / 1000; };
  D.onTargetLost = () => { dOn = false; };
  rec.t0 = performance.now();
  await mindar.start();
  const clock = new THREE.Clock(), inv = new THREE.Matrix4(), rel = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (cSeen) C.group.visible = true;          // 알약 카드에 가려져도 비커는 마지막 자리에
    rec.frames++; if (cOn && dOn) rec.both++;
    let dist = null, tilt = null;
    if (cSeen && dOn) {
      inv.copy(C.group.matrixWorld).invert();
      rel.multiplyMatrices(inv, D.group.matrixWorld).decompose(p, q, s);
      dist = Math.hypot(p.x, p.y);
      const n = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
      tilt = THREE.MathUtils.radToDeg(Math.acos(Math.min(1, Math.abs(n.z))));
      rec.minDist = rec.minDist == null ? dist : Math.min(rec.minDist, dist);
      rec.maxTilt = Math.max(rec.maxTilt, tilt);
      const ready = dist < NEAR && tilt > TILT;
      holdT = ready ? holdT + dt : 0;
      if (holdT > HOLD && cool <= 0) {
        rec.drops++; cool = 1.5; holdT = 0; toast('퐁당! 알약이 들어갔어요');
        const m = new THREE.Mesh(pillGeo, pillMat); m.position.set(Math.max(-0.2, Math.min(0.2, p.x)), Math.max(-0.2, Math.min(0.2, p.y)), 0.8);
        m.userData.v = 0; C.group.add(m); falling.push(m);
      }
    }
    cool -= dt;
    falling.forEach(m => { if (m.position.z > 0.08) { m.userData.v += 2.5 * dt; m.position.z -= m.userData.v * dt; m.rotation.x += 6 * dt; } });
    $('sc').textContent = cOn ? '보임' : (cSeen ? '가려짐(고정)' : '찾는 중'); $('sc').className = cOn ? 'on' : 'off';
    $('sd').textContent = dOn ? '보임' : '찾는 중'; $('sd').className = dOn ? 'on' : 'off';
    $('geo').textContent = dist == null ? '거리 - · 기울기 -' : `거리 ${dist.toFixed(2)} · 기울기 ${tilt.toFixed(0)}°`;
    $('big').textContent = !cSeen ? '비커 카드를 비춰요' : !dOn ? '알약 카드를 가까이 가져와요' : holdT > 0 ? '기울이는 중… 조금만 더' : (dist < NEAR ? '이제 숟가락처럼 기울여요' : '몸 카드 쪽으로 더 가까이');
    $('big').className = holdT > 0 ? 'go' : '';
    fc++; const now = performance.now(); if (now - lt > 1000) { fps = fc; fc = 0; lt = now; }
    $('stat').textContent = `초당 화면 ${fps} · 넣은 알약 ${rec.drops}`;
    renderer.render(scene, camera);
  });
}

function summary() {
  const ua = navigator.userAgent;
  const dev = /iPhone|iPad/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : '기타';
  const f = v => v == null ? '안 됨' : v.toFixed(1) + '초';
  return `[LENS 알약 카드 테스트] ${dev} · 초당 화면 ${fps}\n비커 C 첫 인식 ${f(rec.firstC)}, 알약 D 첫 인식 ${f(rec.firstD)}\n두 카드 함께 보인 비율 ${rec.frames ? Math.round(100 * rec.both / rec.frames) : 0}%\n넣은 알약 ${rec.drops}개, 가장 가까운 거리 ${rec.minDist == null ? '-' : rec.minDist.toFixed(2)}, 가장 크게 기울인 각 ${rec.maxTilt.toFixed(0)}°`;
}
$('go').onclick = () => { $('start').style.display = 'none'; start().catch(() => { $('big').textContent = '카메라를 켤 수 없어요'; }); };
$('copy').onclick = async () => { const s = summary(); try { await navigator.clipboard.writeText(s); toast('복사했어요'); } catch (e) { prompt('복사해 주세요', s); } };
</script>
</body>
</html>
